[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urheiluhallit-kone"
version = "0.5.0"
description = "Urheiluhallien uimakurssien näkyvä selainavustaja ja ohjattu varaus"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "playwright>=1.49,<2", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
uhkone = "uhkone.cli:main"

[tool.setuptools.packages.find]
include = ["uhkone*"]

[tool.setuptools.package-data]
uhkone = ["testshop.html", "data/*.json"]
