name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public source snapshot
        run: python scripts/check_public_tree.py
      - name: Install development dependencies
        run: python -m pip install '.[test]'
      - name: Ruff
        run: uvx ruff@0.17.2 check --output-format=github .
      - name: ty
        run: uvx ty@0.0.91 check --output-format=github --python "$(command -v python)" .
      - name: Install local test browser
        run: python -m playwright install --with-deps chromium
      - name: Test with synthetic participants and local pages
        run: python -m pytest -q
