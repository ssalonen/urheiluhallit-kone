name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Sync development dependencies
        run: uv sync --locked --all-groups
      - name: Check public source snapshot
        run: uv run python scripts/check_public_tree.py
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type check
        run: uv run ty check --output-format=github
      - name: Install local test browser
        run: uv run python -m playwright install --with-deps chromium
      - name: Test with synthetic participants and local pages
        run: PYTHONPATH=. uv run pytest -q
