name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public source snapshot
        run: python scripts/check_public_tree.py
      - name: Install development dependencies
        run: python -m pip install '.[test]'
      - name: Install quality tools
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Type check
        run: ty check --output-format=github
      - name: Install local test browser
        run: python -m playwright install --with-deps chromium
      - name: Test with synthetic participants and local pages
        run: python -m pytest -q
