# Hallien järjestys on samalla toivejärjestys.
[haku]
kurssi = "Leikki-ikäisten jatkouimakoulu"
hallit = ["Mäkelänrinne", "Kallio"]
# Tyhjä lista: kaikki viikonpäivät. Numerot: ma=1 ... su=7.
viikonpaivat = []
arki_aikaisintaan = "17:20"
# Vain nämä kolme viikoittaista vuoroa, tässä etusijajärjestyksessä.
ensisijaiset_vuorot = [
  { halli = "Mäkelänrinne", paiva = 3, aloitus = "17:50" },
  { halli = "Kallio", paiva = 1, aloitus = "18:10" },
  { halli = "Kallio", paiva = 3, aloitus = "18:10" },
]
viikonloppu_aikaisintaan = "09:30"
# Voit lisätä rajoitukset myöhemmin:
# aikaisintaan = "15:00"
# viimeistaan = "19:00"
# alkaen = "2027-01-01"
# asti = "2027-03-31"
# enintaan_euroa = 100

[vahti]
# Paikallisen prosessin on oltava käynnissä. Ei tee varauksia.
vali_sekuntia = 300

[varaus]
# Sopiviin jonoihin voi liittyä haun aikana. Varsinaisia kursseja maksetaan yksi.
jono_varavaihtoehtona = true
